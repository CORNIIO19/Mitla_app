<app-barra-superior
  titulo="Bases de conocimiento"
  [mostrarVolver]="true"
  defaultHref="/inicio">
</app-barra-superior>

<ion-content class="ion-padding">
  <div class="page-container">

  <ion-card>
    <ion-card-header>
      <ion-card-title>
        {{ idBaseEditando ? 'Editar base' : 'Crear nueva base' }}
      </ion-card-title>
    </ion-card-header>

    <ion-card-content>

      <ion-item>
        <ion-label position="stacked">Nombre</ion-label>
        <ion-input
          [(ngModel)]="nombre"
          placeholder="Ej. Sistemas Operativos">
        </ion-input>
      </ion-item>

      <ion-item>
        <ion-label position="stacked">Descripción</ion-label>
        <ion-textarea
          [(ngModel)]="descripcion"
          placeholder="Describe brevemente esta base">
        </ion-textarea>
      </ion-item>

      <ion-button
        *ngIf="!idBaseEditando"
        expand="block"
        class="ion-margin-top"
        (click)="crearBase()"
        [disabled]="creando">

        {{ creando ? 'Creando...' : 'Crear base' }}

      </ion-button>

      <ion-button
        *ngIf="idBaseEditando"
        expand="block"
        class="ion-margin-top"
        (click)="guardarCambios()"
        [disabled]="editando">

        {{ editando ? 'Guardando...' : 'Guardar cambios' }}

      </ion-button>

      <ion-button
        *ngIf="idBaseEditando"
        expand="block"
        fill="clear"
        color="medium"
        (click)="cancelarEdicion()">

        Cancelar edición

      </ion-button>

    </ion-card-content>
  </ion-card>

  <app-mensaje-alerta
    tipo="success"
    [mensaje]="mensaje">
  </app-mensaje-alerta>

  <app-mensaje-alerta
    tipo="danger"
    [mensaje]="error">
  </app-mensaje-alerta>

  <app-estado-carga
    *ngIf="cargando"
    mensaje="Cargando bases...">
  </app-estado-carga>

  <ion-card *ngIf="!cargando">
    <ion-card-header>
      <ion-card-title>Mis bases</ion-card-title>
    </ion-card-header>

    <ion-card-content>

      <app-estado-vacio
        *ngIf="bases.length === 0"
        titulo="Sin bases de conocimiento"
        mensaje="Aún no tienes bases de conocimiento. Crea una para comenzar.">
      </app-estado-vacio>

      <div class="contenedor-bases" *ngIf="bases.length > 0">

        <app-tarjeta-base
          *ngFor="let base of bases"
          [base]="base"
          (abrir)="abrirBase($event)"
          (editar)="iniciarEdicion( $event)">
        </app-tarjeta-base>

      </div>

    </ion-card-content>
  </ion-card>
</div>
</ion-content>
