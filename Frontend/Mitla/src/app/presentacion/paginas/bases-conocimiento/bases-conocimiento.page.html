<app-barra-superior
  titulo="Bases de conocimiento"
  [mostrarVolver]="true"
  defaultHref="/inicio">
</app-barra-superior>

<ion-content class="ion-padding">

  <ion-card>
    <ion-card-header>
      <ion-card-title>
        {{ idBaseEditando ? 'Editar base' : 'Crear nueva base' }}
      </ion-card-title>
    </ion-card-header>

    <ion-card-content>

      <ion-item>
        <ion-label position="stacked">Nombre</ion-label>
        <ion-input
          [(ngModel)]="nombre"
          placeholder="Ej. Sistemas Operativos">
        </ion-input>
      </ion-item>

      <ion-item>
        <ion-label position="stacked">Descripción</ion-label>
        <ion-textarea
          [(ngModel)]="descripcion"
          placeholder="Describe brevemente esta base">
        </ion-textarea>
      </ion-item>

      <ion-button
        *ngIf="!idBaseEditando"
        expand="block"
        class="ion-margin-top"
        (click)="crearBase()"
        [disabled]="creando">

        {{ creando ? 'Creando...' : 'Crear base' }}

      </ion-button>

      <ion-button
        *ngIf="idBaseEditando"
        expand="block"
        class="ion-margin-top"
        (click)="guardarCambios()"
        [disabled]="editando">

        {{ editando ? 'Guardando...' : 'Guardar cambios' }}

      </ion-button>

      <ion-button
        *ngIf="idBaseEditando"
        expand="block"
        fill="clear"
        color="medium"
        (click)="cancelarEdicion()">

        Cancelar edición

      </ion-button>

    </ion-card-content>
  </ion-card>

  <ion-text color="success" *ngIf="mensaje">
    <p>{{ mensaje }}</p>
  </ion-text>

  <ion-text color="danger" *ngIf="error">
    <p>{{ error }}</p>
  </ion-text>

  <div class="estado-carga" *ngIf="cargando">
    <ion-spinner></ion-spinner>
    <p>Cargando bases...</p>
  </div>

  <ion-card *ngIf="!cargando">
    <ion-card-header>
      <ion-card-title>Mis bases</ion-card-title>
    </ion-card-header>

    <ion-card-content>

      <ion-text *ngIf="bases.length === 0">
        <p>Aún no tienes bases de conocimiento.</p>
      </ion-text>

      <div class="contenedor-bases" *ngIf="bases.length > 0">

        <app-tarjeta-base
          *ngFor="let base of bases"
          [base]="base"
          (abrir)="abrirBase($event)"
          (editar)="iniciarEdicion( $event)">
        </app-tarjeta-base>

      </div>

    </ion-card-content>
  </ion-card>

</ion-content>
