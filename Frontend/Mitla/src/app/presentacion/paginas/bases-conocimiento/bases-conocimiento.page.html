<ion-header>
  <ion-toolbar>
    <ion-title>Bases de conocimiento</ion-title>

    <ion-buttons slot="end">
      <ion-button (click)="cerrarSesion()">
        Cerrar sesión
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <ion-card>
    <ion-card-header>
      <ion-card-title>Crear nueva base</ion-card-title>
    </ion-card-header>

    <ion-card-content>

      <ion-item>
        <ion-label position="stacked">Nombre</ion-label>
        <ion-input
          [(ngModel)]="nombre"
          placeholder="Ej. Sistemas Operativos">
        </ion-input>
      </ion-item>

      <ion-item>
        <ion-label position="stacked">Descripción</ion-label>
        <ion-textarea
          [(ngModel)]="descripcion"
          placeholder="Describe brevemente esta base">
        </ion-textarea>
      </ion-item>

      <ion-button
        expand="block"
        class="ion-margin-top"
        (click)="crearBase()"
        [disabled]="creando">

        {{ creando ? 'Creando...' : 'Crear base' }}

      </ion-button>

    </ion-card-content>
  </ion-card>

  <ion-text color="success" *ngIf="mensaje">
    <p>{{ mensaje }}</p>
  </ion-text>

  <ion-text color="danger" *ngIf="error">
    <p>{{ error }}</p>
  </ion-text>

  <div class="estado-carga" *ngIf="cargando">
    <ion-spinner></ion-spinner>
    <p>Cargando bases...</p>
  </div>

  <ion-card *ngIf="!cargando">
    <ion-card-header>
      <ion-card-title>Mis bases</ion-card-title>
    </ion-card-header>

    <ion-card-content>

      <ion-text *ngIf="bases.length === 0">
        <p>Aún no tienes bases de conocimiento.</p>
      </ion-text>

      <ion-list *ngIf="bases.length > 0">

        <ion-item
          button
          *ngFor="let base of bases"
          (click)="abrirBase(base)">

          <ion-label>
            <h2>{{ base.nombre }}</h2>
            <p>{{ base.descripcion || 'Sin descripción' }}</p>
            <p>ID: {{ base.id_base }}</p>
          </ion-label>

        </ion-item>

      </ion-list>

    </ion-card-content>
  </ion-card>

</ion-content>
