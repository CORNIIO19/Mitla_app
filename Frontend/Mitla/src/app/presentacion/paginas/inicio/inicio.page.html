<section class="pagina-inicio">

  <!-- =====================================================
       MENSAJES GENERALES
       ===================================================== -->

  <app-mensaje-alerta
    *ngIf="error"
    tipo="danger"
    [mensaje]="error">
  </app-mensaje-alerta>


  <!-- =====================================================
       ESTADO DE CARGA
       ===================================================== -->

  <app-estado-carga
    *ngIf="cargando"
    mensaje="Cargando dashboard...">
  </app-estado-carga>


  <!-- =====================================================
       ÁREA PRINCIPAL
       ===================================================== -->

  <section
    *ngIf="!cargando"
    class="chat-layout"
    [class.chat-layout-inicial]="!chatIniciado"
    [class.chat-layout-conversacion]="chatIniciado">


    <!-- ===================================================
         ESTADO INICIAL
         =================================================== -->

    <section
      *ngIf="!chatIniciado; else conversacionActiva"
      class="chat-inicial">

      <div class="chat-inicial__contenido">

        <header class="chat-inicial__encabezado">

          <span class="chat-inicial__etiqueta">
            Asistente local
          </span>

          <h1>
            Buenos días,
            {{ usuario?.nombre || 'Usuario' }}
          </h1>

          <p>
            Consulta el contenido de tus bases de conocimiento
            desde un solo lugar.
          </p>

        </header>


        <!-- Selector e input para iniciar la conversación -->

        <div class="chat-inicial__compositor">

          <app-selector-base
            [bases]="bases"
            [idBaseSeleccionada]="idBaseSeleccionada"
            [deshabilitado]="respondiendo"
            (idBaseSeleccionadaChange)="seleccionarBase($event)">
          </app-selector-base>


          <app-chat-input
            [valor]="pregunta"
            [placeholder]="
              'Pregunta algo sobre tus bases de conocimiento...'
            "
            [deshabilitado]="respondiendo"
            (valorChange)="pregunta = $event"
            (enviar)="enviarPregunta()">
          </app-chat-input>

        </div>

      </div>

    </section>


    <!-- ===================================================
         CONVERSACIÓN ACTIVA
         =================================================== -->

    <ng-template #conversacionActiva>

      <app-chat-conversacion
        [mensajes]="mensajesChat"
        [pregunta]="pregunta"
        [inicialUsuario]="inicialUsuario"
        [respondiendo]="respondiendo"
        [bases]="bases"
        [idBaseSeleccionada]="idBaseSeleccionada"
        [errorChat]="errorChat"
        [permitirReintento]="consultaFallida !== null"

        (preguntaChange)="pregunta = $event"
        (idBaseSeleccionadaChange)="seleccionarBase($event)"
        (enviar)="enviarPregunta()"
        (reintentar)="reintentarPregunta()"
        (cerrarError)="cerrarErrorChat()">
      </app-chat-conversacion>

    </ng-template>

  </section>

</section>
