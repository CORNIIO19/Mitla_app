<ion-content fullscreen>

  <main class="auth-layout">

    <section class="auth-panel auth-panel-info">

      <h1 class="auth-frase">
        Crea tu espacio privado para organizar y consultar tu conocimiento.
      </h1>

      <div class="auth-ilustracion">
        <img
          src="assets/Mitla-banner-login 2.png"
          alt="Ilustración de privacidad y conocimiento"
        >
      </div>

      <app-carrusel-frases
        [frases]="frasesPrivacidad"
        [intervalo]="6000">
      </app-carrusel-frases>

    </section>

    <section class="auth-panel auth-panel-formulario">

      <div class="auth-formulario">

        <header class="auth-header">
          <h2>MITLA</h2>
          <p>CREA TU CUENTA</p>
        </header>

        <div class="auth-campo">
          <ion-label>Nombre</ion-label>

          <ion-item lines="none">
            <ion-input
              type="text"
              [(ngModel)]="nombre"
              placeholder="Ingresa tu nombre">
            </ion-input>
          </ion-item>
        </div>

        <div class="auth-campo">
          <ion-label>Correo electrónico</ion-label>

          <ion-item lines="none">
            <ion-input
              type="email"
              [(ngModel)]="email"
              placeholder="correo@ejemplo.com">
            </ion-input>
          </ion-item>
        </div>

        <div class="auth-campo">
          <ion-label>Teléfono</ion-label>

          <ion-item lines="none">
            <ion-input
              type="tel"
              [(ngModel)]="telefono"
              placeholder="Ingresa tu teléfono">
            </ion-input>
          </ion-item>
        </div>

        <div class="auth-campo">
          <ion-label>Contraseña</ion-label>

          <ion-item lines="none">
            <ion-input
              type="password"
              [(ngModel)]="password"
              placeholder="Crea una contraseña">
            </ion-input>
          </ion-item>
        </div>

        <div class="auth-campo">
          <ion-label>Confirmar contraseña</ion-label>

          <ion-item lines="none">
            <ion-input
              type="password"
              [(ngModel)]="confirmarPassword"
              placeholder="Repite tu contraseña">
            </ion-input>
          </ion-item>
        </div>

        <ion-button
          expand="block"
          class="auth-boton-principal"
          (click)="registrar()"
          [disabled]="cargando">

          {{ cargando ? 'Creando cuenta...' : 'Crear cuenta' }}

        </ion-button>

        <ion-text color="success" *ngIf="mensaje">
          <p class="auth-mensaje">{{ mensaje }}</p>
        </ion-text>

        <ion-text color="danger" *ngIf="error">
          <p class="auth-error">{{ error }}</p>
        </ion-text>

        <button
          type="button"
          class="auth-link"
          routerLink="/login">

          ¿Ya tienes cuenta? Inicia sesión

        </button>

      </div>

    </section>

  </main>

</ion-content>
