<ion-header>
  <ion-toolbar>

    <ion-buttons slot="start" *ngIf="mostrarVolver">
      <ion-back-button [defaultHref]="defaultHref"></ion-back-button>
    </ion-buttons>

    <ion-title>{{ titulo }}</ion-title>

    <ion-buttons slot="end" *ngIf="mostrarCerrarSesion">
      <ion-button (click)="cerrarSesion()">
        Cerrar sesión
      </ion-button>
    </ion-buttons>

  </ion-toolbar>
</ion-header>
