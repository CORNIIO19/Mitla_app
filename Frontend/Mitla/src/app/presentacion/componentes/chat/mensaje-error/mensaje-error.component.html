<aside
  class="mensaje-error"
  role="alert"
  aria-live="assertive">

  <!-- Icono de advertencia -->
  <div
    class="mensaje-error__icono"
    aria-hidden="true">

    <svg
      viewBox="0 0 24 24"
      fill="none">

      <path
        d="M12 8V13"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round">
      </path>

      <circle
        cx="12"
        cy="16.5"
        r="1"
        fill="currentColor">
      </circle>

      <path
        d="M10.28 4.96L3.82 16.14C3.05 17.47 4.01 19.13 5.55 19.13H18.47C20.01 19.13 20.97 17.47 20.2 16.14L13.74 4.96C12.97 3.63 11.05 3.63 10.28 4.96Z"
        stroke="currentColor"
        stroke-width="1.6"
        stroke-linejoin="round">
      </path>

    </svg>

  </div>


  <!-- Información del error -->
  <div class="mensaje-error__contenido">

    <strong class="mensaje-error__titulo">
      MITLA no pudo responder
    </strong>

    <p class="mensaje-error__descripcion">
      {{ mensaje }}
    </p>

    <div class="mensaje-error__acciones">

      <button
        *ngIf="permitirReintento"
        class="mensaje-error__boton mensaje-error__boton--principal"
        type="button"
        [disabled]="deshabilitado"
        (click)="solicitarReintento()">

        <svg
          viewBox="0 0 24 24"
          fill="none"
          aria-hidden="true">

          <path
            d="M19 8V4M19 4H15M19 4L16.25 6.75C13.9 4.4 10.1 4.4 7.75 6.75C5.4 9.1 5.4 12.9 7.75 15.25C10.1 17.6 13.9 17.6 16.25 15.25"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
            stroke-linejoin="round">
          </path>

        </svg>

        <span>
          Reintentar
        </span>

      </button>


      <button
        class="mensaje-error__boton mensaje-error__boton--secundario"
        type="button"
        [disabled]="deshabilitado"
        (click)="cerrarMensaje()">

        Cerrar

      </button>

    </div>

  </div>


  <!-- Botón rápido para cerrar -->
  <button
    class="mensaje-error__cerrar"
    type="button"
    aria-label="Cerrar mensaje de error"
    title="Cerrar"
    [disabled]="deshabilitado"
    (click)="cerrarMensaje()">

    <svg
      viewBox="0 0 24 24"
      fill="none"
      aria-hidden="true">

      <path
        d="M7 7L17 17M17 7L7 17"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round">
      </path>

    </svg>

  </button>

</aside>
