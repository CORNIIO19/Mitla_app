<section class="chat-conversacion">

  <!-- =====================================================
       ÁREA DE MENSAJES
       ===================================================== -->

  <div
    #contenedorMensajes
    *ngIf="
    mensajes.length > 0 ||
    respondiendo ||
    errorChat;
    else estadoVacio"
    class="chat-conversacion__thread"
    aria-live="polite">

    <ng-container *ngFor="let mensaje of mensajes">

      <!-- Mensaje escrito por el usuario -->
      <app-mensaje-usuario
        *ngIf="mensaje.rol === 'usuario'; else mensajeModelo"
        [mensaje]="mensaje"
        [inicialUsuario]="inicialUsuario">
      </app-mensaje-usuario>

      <!-- Mensaje generado por MITLA -->
      <ng-template #mensajeModelo>

        <app-mensaje-modelo
          [mensaje]="mensaje">
        </app-mensaje-modelo>

      </ng-template>

    </ng-container>


    <!-- =====================================================
         INDICADOR DE ESCRITURA
         ===================================================== -->

    <app-indicador-escritura
      *ngIf="respondiendo">
    </app-indicador-escritura>

  </div>

  <!-- =====================================================
     ERROR DE CONSULTA
     ===================================================== -->

  <app-mensaje-error
    *ngIf="errorChat"
    [mensaje]="errorChat"
    [permitirReintento]="permitirReintento"
    [deshabilitado]="respondiendo"
    (reintentar)="reintentar.emit()"
    (cerrar)="cerrarError.emit()">
  </app-mensaje-error>
  
  <!-- =====================================================
       ESTADO SIN MENSAJES
       ===================================================== -->

  <ng-template #estadoVacio>

    <div class="chat-conversacion__vacio">

      <div
        class="chat-conversacion__vacio-icono"
        aria-hidden="true">

        M

      </div>

      <h3>
        Empieza una conversación
      </h3>

      <p>
        Selecciona una base de conocimiento y escribe
        una pregunta para comenzar a conversar con tus documentos.
      </p>

    </div>

  </ng-template>


  <!-- =====================================================
       COMPOSITOR DEL CHAT
       ===================================================== -->

  <footer class="chat-conversacion__entrada">

    <div class="chat-conversacion__compositor">

      <!-- Selección de la base que será consultada -->
      <app-selector-base
        [bases]="bases"
        [idBaseSeleccionada]="idBaseSeleccionada"
        [deshabilitado]="respondiendo"
        (idBaseSeleccionadaChange)="
          idBaseSeleccionadaChange.emit($event)
        ">
      </app-selector-base>


      <!-- Escritura y envío de la pregunta -->
      <app-chat-input
        [valor]="pregunta"
        [placeholder]="placeholder"
        [deshabilitado]="respondiendo"
        (valorChange)="preguntaChange.emit($event)"
        (enviar)="enviar.emit()">
      </app-chat-input>

    </div>

  </footer>

</section>
