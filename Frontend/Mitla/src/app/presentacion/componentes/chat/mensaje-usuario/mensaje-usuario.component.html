<article class="mensaje mensaje-usuario">
  <div class="mensaje-avatar">
    {{ inicialUsuario }}
  </div>

  <div class="mensaje-cuerpo">
    <div class="mensaje-autor">Tú</div>

    <div class="mensaje-contenido">
      <p>{{ mensaje.contenido }}</p>
      <small>{{ mensaje.hora }}</small>
    </div>
  </div>
</article>
